[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "style-dataset"
version = "0.1.0"
description = "A dataset for fashion analytics"
requires-python = ">=3.11"
dependencies = [
    "crawl4ai==0.9.4",
    "google-genai==2.28.0",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "python-dotenv==1.2.4",
    "tenacity==9.1.4",
    "Pillow==12.3.0",
    "pydantic"
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The modules in src/ import each other as top-level modules (e.g. `from schema import ...`)
pythonpath = ["src"]

[tool.ruff.lint]
# Pyflakes and the pycodestyle error rules. Listed explicitly because the default
# rule set changes between ruff releases, which would break CI on version bumps.
select = ["E4", "E7", "E9", "F"]
